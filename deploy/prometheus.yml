global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: 'packetlens-inference'
    static_configs:
      - targets: ['localhost:8000']  # رجعناها localhost
    metrics_path: /metrics
    scheme: http

  - job_name: 'packetlens-sniffer'
    static_configs:
      - targets: ['localhost:9091']  # رجعناها localhost
    metrics_path: /metrics
    scheme: http

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']